<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Arm Tank Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --a-paper: #EDE9E0; --a-ink: #1A1815; --a-rust: #B23A29; --a-shadow: #26221E; --a-line: #8C857A;
  }
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; background: var(--a-paper); color: var(--a-ink); font: 1rem/1.5 Archivo, Inter, system-ui, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 80px; }
  header { position: relative; border-bottom: 1px solid var(--a-line); padding-bottom: 32px; margin-bottom: 40px; }
  .meta { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--a-line); }
  header .meta.tr { position: absolute; right: 0; top: 0; text-align: right; }
  h1 { font-weight: 900; font-size: clamp(3.2rem, 11vw, 8.5rem); line-height: .9; margin: 24px 0 0; letter-spacing: -.02em; }
  h1 .rust { color: var(--a-rust); }
  .sun { position: absolute; right: 0; bottom: 32px; width: clamp(70px, 14vw, 130px); aspect-ratio: 1; background: var(--a-rust); border-radius: 50%; }
  .lede { max-width: 560px; margin: 20px 0 0; }
  .bar { display: flex; align-items: center; gap: 16px; margin: 0 0 32px; }
  .bar .track { flex: 1; height: 6px; background: #d9d4c8; }
  .bar .fill { height: 100%; width: 0; background: var(--a-ink); transition: width .3s; }
  .phase { display: grid; grid-template-columns: 88px 1fr; gap: 0 24px; padding: 28px 0; border-top: 1px solid var(--a-line); }
  .num { font-weight: 900; font-size: 3rem; line-height: .9; }
  .phase h2 { font-weight: 900; font-size: 1.5rem; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .01em; }
  .phase .when { margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dotted #cfc9bc; }
  li:last-child { border-bottom: 0; }
  input[type=checkbox] { appearance: none; flex: none; width: 18px; height: 18px; margin-top: 3px; border: 2px solid var(--a-ink); background: transparent; cursor: pointer; }
  input[type=checkbox]:checked { background: var(--a-ink); box-shadow: inset 0 0 0 3px var(--a-paper); }
  li.done span { color: var(--a-line); text-decoration: line-through; }
  .check { margin-top: 12px; padding: 10px 14px; background: var(--a-shadow); color: var(--a-paper); font-size: .875rem; }
  .check b { color: #fff; letter-spacing: .14em; font-size: .75rem; text-transform: uppercase; margin-right: 8px; }
  .flow { display: flex; flex-wrap: wrap; gap: 0; margin: 0 0 40px; border: 1px solid var(--a-ink); }
  .flow a { flex: 1 1 120px; padding: 12px; color: var(--a-ink); text-decoration: none; border-right: 1px solid var(--a-ink); font-size: .875rem; }
  .flow a:last-child { border-right: 0; }
  .flow a span { display: block; font-weight: 900; font-size: 1.5rem; }
  .flow a.done { background: var(--a-ink); color: var(--a-paper); }
  footer { border-top: 1px solid var(--a-line); padding-top: 20px; display: flex; justify-content: space-between; }
  @media (max-width: 640px) {
    .phase { grid-template-columns: 1fr; }
    .num { font-size: 2.2rem; margin-bottom: 6px; }
    .sun { display: none; }
    header .meta.tr { position: static; text-align: left; margin-bottom: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="meta tr">Robot Arm Tank<br>P-P 1.2 mini<br>PS5 + ESP32</div>
    <div class="meta">Build process</div>
    <h1>PRINT.<br>WIRE.<br><span class="rust">BUILD.</span></h1>
    <div class="sun" aria-hidden="true"></div>
    <p class="lede">The whole build in 12 phases, in order. Tick steps as you go; ticks are saved in this browser. Full details for every step are in <b>1_SETUP_AND_ASSEMBLY.md</b>.</p>
  </header>

  <div class="bar"><span class="meta" id="count">0 / 0 steps</span><div class="track"><div class="fill" id="fill"></div></div></div>
  <nav class="flow" id="flow"></nav>
  <main id="phases"></main>

  <footer><span class="meta">No solder anywhere</span><span class="meta">2026</span></footer>
</div>

<script>
const PHASES = [
  ["Parts check", "When the boxes arrive", [
    "Every part in the guide's parts table is here",
    "Batteries are real: green, flat top, ~45 g, printed INR18650-25R",
    "PCA9685 headers already soldered (not loose in the bag)",
    "TT motors have their wires attached"],
    "Nothing missing, nothing fake."],
  ["Print", "Start first, it's the longest step", [
    "Test print: one bearing seat and one servo pocket fit",
    "Arm parts (DBI orientation, supports on, links 10% infill)",
    "Gears, rings, claw parts at 0.12 mm and 100% / 30%",
    "Tank: tub, lid, fenders, clamps, mast parts",
    "Tires in TPU"],
    "Bearing presses in, MG90S slides into its pocket."],
  ["Tank firmware", "ESP32-WROOM-32U", [
    "Arduino IDE + Bluepad32 board URL added",
    "ESP32 + Bluepad32 boards and Adafruit PWM Servo Driver installed",
    "arm_tank.ino uploaded as ESP32 Dev Module"],
    "Serial Monitor shows the Bluepad32 banner."],
  ["Camera firmware", "XIAO ESP32-S3 Sense", [
    "Camera board clipped on, antenna pigtail on the U.FL jack",
    "Password changed in camera.ino, uploaded as XIAO_ESP32S3 + OPI PSRAM"],
    "Phone on armtank-cam sees video at 192.168.4.1."],
  ["Pair PS5", "DualSense", [
    "Hold Create + PS until the light bar flashes fast"],
    "Light bar goes solid; Serial Monitor says connected."],
  ["Hull", "Tub, motors, bay", [
    "TT motors in, clamp screwed on with foam tape",
    "Switch in the front wall",
    "Battery holder, XL4015, ZK-5AD, ESP32, PCA9685 velcroed in",
    "Controller antenna in the lid's rear-right hole"],
    "Everything sits flat, lid closes."],
  ["Power", "Lever connectors, no solder", [
    "XL4015 set to 5.1 V BEFORE anything else is connected",
    "Battery + through the switch, rails A-F joined as the guide's table",
    "1000uF capacitor in the PCA9685 V+ terminal (long leg +)",
    "Dupont: I2C to PCA9685, GPIO25/26/27/33 to ZK-5AD"],
    "Switch on: 5.1 V on the display, left stick spins the wheels."],
  ["Servo prep", "Before any horn goes on", [
    "All servos plugged in, powered to 90, no horns",
    "Shaft-end tab snipped off every arm servo",
    "Horns cut down to hub + 2 mm stub"],
    "Nobody turns a servo by hand from here."],
  ["Base", "Lid servo + Sockel", [
    "Base MG90S in the lid slot",
    "arm_base_lower bolted to the lid (4x M3)",
    "Base gear on the horn, arm will face forward",
    "Bearing + arm_base_upper on"],
    "Base turns smoothly both ways."],
  ["Arm joints", "Shoulder, elbow, wrist", [
    "Bearings in every seat, arm_ring onto the 3 pins (no planets)",
    "Servo in, joint gear on the horn stub",
    "Joint held at home angle while meshing: 30° / 70° / 80°",
    "E-clip on each shaft, covers on, cables routed",
    "Unten screwed to the base gear prongs"],
    "Sticks move each joint the right way (else flip its GEAR sign)."],
  ["Claw + camera", "Gripper and mast", [
    "Claw servo, grip gear, pinion, cover",
    "Jaws slid in at fully closed (L2 held), fingertips touching",
    "Mast on its pivot, lock pin knob on",
    "Pan servo, yoke, tilt servo, camera head, XIAO, antenna up"],
    "R2 opens ~37 mm; phone video pans and tilts."],
  ["Final", "Close up and test", [
    "Lid and fenders on",
    "Triangle: arm home, claw visible on the phone",
    "Circle then fold the mast, unfold, Triangle",
    "Base swung ±80° with nothing rubbing"],
    "Drive it."]
];

const KEY = "armtank-build-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const main = document.getElementById("phases");
const flow = document.getElementById("flow");
let total = 0;
PHASES.forEach(([title, when, steps, check], p) => {
  const id = "p" + (p + 1);
  const a = document.createElement("a");
  a.href = "#" + id;
  a.innerHTML = `<span>${String(p + 1).padStart(2, "0")}</span>${title}`;
  flow.appendChild(a);
  const sec = document.createElement("section");
  sec.className = "phase"; sec.id = id;
  sec.innerHTML = `<div class="num">${String(p + 1).padStart(2, "0")}</div>
    <div><h2>${title}</h2><p class="when meta">${when}</p><ul></ul>
    <div class="check"><b>Done when</b>${check}</div></div>`;
  const ul = sec.querySelector("ul");
  steps.forEach((s, i) => {
    total++;
    const k = `${p}-${i}`;
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!state[k]; cb.setAttribute("aria-label", s);
    const sp = document.createElement("span"); sp.textContent = s;
    li.append(cb, sp);
    li.classList.toggle("done", cb.checked);
    cb.addEventListener("change", () => { state[k] = cb.checked; li.classList.toggle("done", cb.checked); save(); update(); });
    ul.appendChild(li);
  });
  main.appendChild(sec);
});

function update() {
  let done = 0;
  PHASES.forEach(([, , steps], p) => {
    const all = steps.every((_, i) => state[`${p}-${i}`]);
    steps.forEach((_, i) => { if (state[`${p}-${i}`]) done++; });
    flow.children[p].classList.toggle("done", all);
  });
  document.getElementById("count").textContent = `${done} / ${total} steps`;
  document.getElementById("fill").style.width = (100 * done / total) + "%";
}
update();
</script>
</body>
</html>
